<!doctype html>
<html>
<body>
<h1>Edit Category</h1>
<form method="post" action="/categories/{{ id }}/edit">
  <input type="hidden" name="authenticity_token" value="{{ edit_token }}">
  <label>Name: <input type="text" name="name" value="{{ name }}" maxlength="120" required></label>
  <button type="submit">Save</button>
</form>
<div>
  <form method="post" action="/categories/{{ id }}/delete">
    <input type="hidden" name="authenticity_token" value="{{ delete_token }}">
    <button type="submit" onclick="return confirm('Delete this category and all its items?')">Delete category</button>
  </form>
</div>
<p><a href="/restaurants/{{ restaurant_id }}/categories">Back to categories</a></p>
</body>
</html>
